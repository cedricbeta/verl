hydra:
  run:
    dir: ./cg_bench_hydra_outputs/eval_step_global_step_100
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=./cg_bench_hydra_outputs/eval_step_global_step_100
    - hydra.mode=RUN
    task:
    - +trainer.run_cg_bench_evaluation=true
    - +trainer.cg_bench_json_path=/home/chendong/video-rl/cg-bench/reformatted_cg_bench_mini.jsonl
    - +trainer.val_only=true
    - +trainer.val_only_after_cg_bench=true
    - +trainer.cg_bench_output_dir=/home/chendong/video-rl/cg-bench
    - trainer.val_before_train=false
    - trainer.resume_mode=resume_path
    - trainer.resume_from_path=/home/chendong/video-rl/Temporal-R1/checkpoints/easy_r1/qwen2_5_vl_7b_tvg_0610/global_step_100
    - +data.video_base_path=/home/chendong/video-rl/cg-bench/cg_videos_720p
    - data.val_files=null
    - data.train_files=/home/chendong/video-rl/charades_sta/charades_vqa_train.jsonl
    - data.val_files=/home/chendong/video-rl/charades_sta/charades_vqa_val.jsonl
    - data.max_prompt_length=25284
    - data.max_response_length=2048
    - actor_rollout_ref.model.path=Qwen/Qwen2.5-VL-7B-Instruct
    - actor_rollout_ref.actor.strategy=fsdp
    - actor_rollout_ref.rollout.n=1
    - +actor_rollout_ref.rollout.max_new_tokens_grounding_eval=70
    - +actor_rollout_ref.rollout.do_sample_grounding_eval=false
    - +actor_rollout_ref.rollout.max_new_tokens_qa_eval=50
    - +actor_rollout_ref.rollout.do_sample_qa_eval=false
    - trainer.n_gpus_per_node=4
    - trainer.nnodes=1
    - +trainer.grounding_weight=0.4
    - +trainer.qa_accuracy_weight=0.4
    - +trainer.qa_format_weight=0.2
    - +trainer.thinking_tag_bonus=0.05
    - trainer.logger=["console"]
  job:
    name: eval_cgbench
    chdir: null
    override_dirname: +actor_rollout_ref.rollout.do_sample_grounding_eval=false,+actor_rollout_ref.rollout.do_sample_qa_eval=false,+actor_rollout_ref.rollout.max_new_tokens_grounding_eval=70,+actor_rollout_ref.rollout.max_new_tokens_qa_eval=50,+data.video_base_path=/home/chendong/video-rl/cg-bench/cg_videos_720p,+trainer.cg_bench_json_path=/home/chendong/video-rl/cg-bench/reformatted_cg_bench_mini.jsonl,+trainer.cg_bench_output_dir=/home/chendong/video-rl/cg-bench,+trainer.grounding_weight=0.4,+trainer.qa_accuracy_weight=0.4,+trainer.qa_format_weight=0.2,+trainer.run_cg_bench_evaluation=true,+trainer.thinking_tag_bonus=0.05,+trainer.val_only=true,+trainer.val_only_after_cg_bench=true,actor_rollout_ref.actor.strategy=fsdp,actor_rollout_ref.model.path=Qwen/Qwen2.5-VL-7B-Instruct,actor_rollout_ref.rollout.n=1,data.max_prompt_length=25284,data.max_response_length=2048,data.train_files=/home/chendong/video-rl/charades_sta/charades_vqa_train.jsonl,data.val_files=/home/chendong/video-rl/charades_sta/charades_vqa_val.jsonl,data.val_files=null,trainer.logger=["console"],trainer.n_gpus_per_node=4,trainer.nnodes=1,trainer.resume_from_path=/home/chendong/video-rl/Temporal-R1/checkpoints/easy_r1/qwen2_5_vl_7b_tvg_0610/global_step_100,trainer.resume_mode=resume_path,trainer.val_before_train=false
    id: ???
    num: ???
    config_name: vqa
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/chendong/video-rl/verl-video
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/chendong/video-rl/verl-video/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/chendong/video-rl/verl-video/cg_bench_hydra_outputs/eval_step_global_step_100
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
