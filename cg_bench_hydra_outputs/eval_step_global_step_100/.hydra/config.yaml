data:
  train_files: /home/chendong/video-rl/charades_sta/charades_vqa_train.jsonl
  val_files: /home/chendong/video-rl/charades_sta/charades_vqa_val.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  tokenizer: null
  video_key: null
  train_batch_size: 512
  val_batch_size: null
  return_raw_input_ids: false
  return_raw_chat: false
  shuffle: true
  filter_overlong_prompts: false
  filter_overlong_prompts_workers: 1
  truncation: error
  max_prompt_length: 25284
  max_response_length: 2048
  system_prompt: "You are a temporal grounding assistant.  You will be given: - “frames”:\
    \ an ordered list of video frames (frame_0 … frame_n). - “question”: a natural-language\
    \ query that asks for a time interval in the video.\nUse the following procedure:\
    \ 1. FIRST think through your reasoning as an internal monologue, and enclose\
    \ it within <think>…</think> tags. 2. THEN give the start and end times (in frame_id,\
    \ as int) by identifying frame indices. 3. Finally, output your result enclosed\
    \ in <answer>…</answer> tags, in JSON format:\n      <answer>{\"start_time\":\
    \ <int>, \"end_time\": <int>}</answer>\n  If the answer is not computable, output:\n\
    \      <answer>{\"start_time\": 0, \"end_time\": 0}</answer>\n\nExample structure:\
    \ <think> – I see that the action starts around frame 5…  – It ends around frame\
    \ 20, because... </think> <answer>{\"start_time\": 5, \"end_time\": 20}</answer>\n"
  custom_cls:
    path: null
    name: null
  video_base_path: /home/chendong/video-rl/cg-bench/cg_videos_720p
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: Qwen/Qwen2.5-VL-7B-Instruct
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: true
    use_remove_padding: false
    use_liger: false
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 4
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 15360
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    entropy_coeff: 0.001
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    ulysses_sequence_parallel_size: 1
    checkpoint:
      contents:
      - model
      - optimizer
      - extra
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      wrap_policy:
        min_num_params: 0
      fsdp_size: -1
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: false
      wrap_policy:
        min_num_params: 0
    log_prob_micro_batch_size: null
    ppo_mini_batch_size: 4
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1
    top_p: 1
    use_fire_sampling: false
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.5
    ignore_eos: false
    enforce_eager: false
    free_cache_engine: false
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 32768
    max_model_len: null
    max_num_seqs: 1024
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: true
    enable_chunked_prefill: true
    do_sample: true
    'n': 1
    engine_kwargs:
      swap_space: null
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0
      'n': 1
      do_sample: false
    max_new_tokens_grounding_eval: 70
    do_sample_grounding_eval: false
    max_new_tokens_qa_eval: 50
    do_sample_qa_eval: false
critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: fsdp
  optim:
    lr: 1.0e-05
    lr_warmup_steps_ratio: 0.0
    min_lr_ratio: null
    warmup_style: constant
    total_training_steps: -1
    weight_decay: 0.01
  model:
    path: Qwen/Qwen2.5-VL-3B-Instruct
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: {}
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: true
    use_remove_padding: false
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      wrap_policy:
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null
  ppo_micro_batch_size_per_gpu: 1
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768
  forward_max_token_len_per_gpu: 32768
  ulysses_sequence_parallel_size: 1
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  checkpoint:
    contents:
    - model
    - optimizer
    - extra
reward_model:
  enable: false
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: false
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: false
      fsdp_size: -1
  micro_batch_size: null
  micro_batch_size_per_gpu: 2
  max_length: null
  ulysses_sequence_parallel_size: 1
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  reward_manager: naive
custom_reward_function:
  path: null
  name: compute_score
algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: reinforce_plus_plus
  use_kl_in_reward: true
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
trainer:
  balance_batch: true
  total_epochs: 10
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger:
  - console
  log_val_generations: 0
  nnodes: 1
  n_gpus_per_node: 4
  save_freq: 10
  resume_mode: resume_path
  resume_from_path: /home/chendong/video-rl/Temporal-R1/checkpoints/easy_r1/qwen2_5_vl_7b_tvg_0610/global_step_100
  val_before_train: false
  test_freq: 100
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: false
  default_local_dir: /home/chendong/video-rl/verl-video/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  ray_wait_register_center_timeout: 300
  run_cg_bench_evaluation: true
  cg_bench_json_path: /home/chendong/video-rl/cg-bench/reformatted_cg_bench_mini.jsonl
  val_only: true
  val_only_after_cg_bench: true
  cg_bench_output_dir: /home/chendong/video-rl/cg-bench
  grounding_weight: 0.4
  qa_accuracy_weight: 0.4
  qa_format_weight: 0.2
  thinking_tag_bonus: 0.05
